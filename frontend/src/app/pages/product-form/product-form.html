
<div class="page-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">🛒</span>
      <span>Gestion<br>Commerciale</span>
    </div>

    <nav>
      <a href="#" class="nav-link">⌂ Dashboard</a>
      <a href="#" class="nav-link">♟ Clients</a>
      <a href="#" class="nav-link active">◇ Produits</a>
      <a href="#" class="nav-link">🛒 Commandes</a>
    </nav>

    <a href="#" class="logout">↪ Déconnexion</a>
  </aside>

  <!-- Main content -->
  <main class="main-content">

    <!-- Topbar -->
    <header class="topbar">
      <h2>◇ Ajouter un produit</h2>
      <div class="user">● Khouloud ⌄</div>
    </header>

    <!-- Content -->
    <section class="content">

      <div class="form-card">

        <div class="section-title">
          <span class="section-icon">◇</span>
          <h3>Informations du produit</h3>
        </div>

        <form>

          <div class="form-grid">

            <!-- Reference -->
            <div class="form-group">
              <label for="reference">
                Référence <span>*</span>
              </label>
              <input
                type="text"
                id="reference"
                placeholder="Ex: PRD001"
                required
              >
            </div>

            <!-- Price -->
            <div class="form-group">
              <label for="price">
                Prix unitaire HT <span>*</span>
              </label>
              <div class="input-unit">
                <input
                  type="number"
                  id="price"
                  placeholder="0.00"
                  min="0"
                  step="0.01"
                  required
                >
                <span>TND</span>
              </div>
            </div>

            <!-- Product name -->
            <div class="form-group">
              <label for="name">
                Nom du produit <span>*</span>
              </label>
              <input
                type="text"
                id="name"
                placeholder="Ex: Laptop HP"
                required
              >
            </div>

            <!-- Stock -->
            <div class="form-group">
              <label for="stock">
                Quantité en stock <span>*</span>
              </label>
              <input
                type="number"
                id="stock"
                placeholder="0"
                min="0"
                required
              >
            </div>

            <!-- Description -->
            <div class="form-group">
              <label for="description">
                Description
              </label>
              <textarea
                id="description"
                placeholder="Description du produit..."
                rows="3"
              ></textarea>
            </div>

            <!-- Date -->
            <div class="form-group">
              <label for="date">
                Date de création
              </label>
              <input
                type="date"
                id="date"
              >
            </div>

          </div>

          <!-- Buttons -->
          <div class="form-actions">
            <button type="button" class="btn-cancel">
              ↻ Annuler
            </button>

            <button type="submit" class="btn-save">
              ▣ Enregistrer
            </button>
          </div>

        </form>

      </div>

    </section>

  </main>
</div>
