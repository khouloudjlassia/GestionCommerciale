@if (confirmService.options(); as o) {
  <div class="confirm-overlay" (click)="confirmService.answer(false)">
    <div class="confirm-box" (click)="$event.stopPropagation()">

      <div class="confirm-icon">!</div>

      <h3>{{ o.title }}</h3>
      <p>{{ o.message }}</p>

      <div class="confirm-actions">
        <button type="button" class="btn-cancel" (click)="confirmService.answer(false)">
          Annuler
        </button>
        <button type="button" class="btn-confirm" (click)="confirmService.answer(true)">
          {{ o.confirmLabel ?? 'Confirmer' }}
        </button>
      </div>

    </div>
  </div>
}
